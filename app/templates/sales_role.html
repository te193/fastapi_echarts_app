{% extends "base.html" %}

{% block content %}
<div class="sales-role-page">
  <header class="sales-role-topbar">
    <div>
      <p class="section-kicker">销售角色</p>
      <h1>销售角色分析</h1>
      <p id="summaryHint" class="sales-role-period"></p>
    </div>
    <div class="sales-role-top-actions">
      <div id="viewToggle" class="sales-role-view-toggle" role="group" aria-label="切换分析视图">
        <button type="button" data-view="role">销售角色</button>
        <button type="button" data-view="lifecycle">生命周期</button>
      </div>
      <button id="exportBtn" class="sales-role-action primary" type="button">导出明细</button>
      <button id="clearFiltersBtn" class="sales-role-action" type="button">重置</button>
    </div>
  </header>

  <section class="sales-role-filter-panel">
    <div class="sales-role-filter-main">
      <label class="sales-role-field period-field">
        <span>统计周期</span>
        <div id="periodButtons" class="sales-role-period-buttons" role="group" aria-label="选择统计周期"></div>
      </label>
      <label class="sales-role-field">
        <span>国家类别</span>
        <select id="countryCategorySelect"></select>
      </label>
      <label class="sales-role-field">
        <span>店铺新</span>
        <select id="sellerNameSelect"></select>
      </label>
      <label class="sales-role-field">
        <span>销售角色</span>
        <select id="salesRoleSelect"></select>
      </label>
      <label id="lifecycleField" class="sales-role-field lifecycle-field" hidden>
        <span>生命周期</span>
        <select id="lifecycleSelect"></select>
      </label>
      <label class="sales-role-field keyword-field">
        <span>关键词</span>
        <input id="keywordInput" type="search" placeholder="搜索 MSKU / SKU / 店铺">
      </label>
    </div>
    <div class="sales-role-filter-footer">
      <span class="toolbar-label">当前条件</span>
      <div id="activeFilterChips" class="sales-role-chip-list"></div>
    </div>
  </section>

  <section class="sales-role-overview">
    <div class="sales-role-panel summary-panel">
      <div class="sales-role-section-head">
        <div>
          <p id="summaryPanelKicker" class="section-kicker">核心概览</p>
          <h2 id="summaryPanelTitle">经营规模</h2>
        </div>
      </div>
      <div id="summaryGrid" class="sales-role-summary-grid"></div>
    </div>

    <div class="sales-role-panel role-panel">
      <div class="sales-role-section-head">
        <div>
          <p id="distributionKicker" class="section-kicker">角色分布</p>
          <h2 id="distributionTitle">四类销售角色</h2>
        </div>
      </div>
      <div id="roleGrid" class="sales-role-grid"></div>
    </div>
  </section>

  <section class="sales-role-panel matrix-panel">
    <div class="sales-role-section-head">
      <div>
        <p id="matrixKicker" class="section-kicker">二维矩阵</p>
        <h2 id="matrixTitle">日销 × 毛利率</h2>
      </div>
    </div>
    <div id="matrixGrid" class="sales-role-matrix"></div>
  </section>

  <section class="sales-role-panel detail-panel">
    <div class="sales-role-section-head">
      <div>
        <p id="detailKicker" class="section-kicker">明细清单</p>
        <h2 id="detailTitle">MSKU 销售角色明细</h2>
      </div>
      <p id="tableSummary" class="summary-hint"></p>
    </div>
    <div id="tableWrap" class="detail-table-wrap"></div>
    <div id="pagination" class="pagination sales-role-pagination"></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/sales_role.js') }}?v=20260708a"></script>
{% endblock %}
