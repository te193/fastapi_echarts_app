<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-quartz.css">
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=20260605tables">
</head>
<body data-page="{{ page }}">
  <div class="app-shell">
    <aside class="side-nav">
      <div class="side-nav-brand">
        <span class="side-nav-brand-mark">产品</span>
        <strong>产品结构看板</strong>
      </div>
      <nav class="side-nav-links">
        <a class="side-nav-link {% if page == 'dashboard' %}active{% endif %}" href="/" title="结构概览">
          <span class="side-nav-icon">总</span>
          <span class="side-nav-label">总览</span>
          <span class="side-nav-full-label">结构概览</span>
        </a>
        <a class="side-nav-link {% if page == 'layers' %}active{% endif %}" href="/layers" title="分层分布">
          <span class="side-nav-icon">层</span>
          <span class="side-nav-label">分层</span>
          <span class="side-nav-full-label">分层分布</span>
        </a>
        <a class="side-nav-link {% if page == 'matrix' %}active{% endif %}" href="/matrix" title="交叉矩阵">
          <span class="side-nav-icon">矩</span>
          <span class="side-nav-label">矩阵</span>
          <span class="side-nav-full-label">交叉矩阵</span>
        </a>
        <a class="side-nav-link {% if page == 'detail' %}active{% endif %}" href="/detail" title="产品明细">
          <span class="side-nav-icon">明</span>
          <span class="side-nav-label">明细</span>
          <span class="side-nav-full-label">产品明细</span>
        </a>
        <a class="side-nav-link {% if page == 'alerts' %}active{% endif %}" href="/alerts" title="异常预警">
          <span class="side-nav-icon">警</span>
          <span class="side-nav-label">预警</span>
          <span class="side-nav-full-label">异常预警</span>
        </a>
        <a class="side-nav-link {% if page == 'opportunities' %}active{% endif %}" href="/opportunities" title="机会 SKU 池">
          <span class="side-nav-icon">机</span>
          <span class="side-nav-label">机会</span>
          <span class="side-nav-full-label">机会池</span>
        </a>
        <a class="side-nav-link {% if page == 'inventory_weekly' %}active{% endif %}" href="/inventory-weekly" title="库存周报">
          <span class="side-nav-icon">库</span>
          <span class="side-nav-label">库存</span>
          <span class="side-nav-full-label">库存周报</span>
        </a>
        <a class="side-nav-link {% if page == 'price_review' %}active{% endif %}" href="/price-review" title="调价复盘">
          <span class="side-nav-icon">复</span>
          <span class="side-nav-label">复盘</span>
          <span class="side-nav-full-label">调价复盘</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-shell">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  {% block overlay %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <script src="{{ url_for('static', path='js/common.js') }}?v=20260602a"></script>
  <script src="{{ url_for('static', path='js/ag_grid_helper.js') }}?v=20260604a"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
