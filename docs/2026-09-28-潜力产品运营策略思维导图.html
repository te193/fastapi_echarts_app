const NS='http://www.w3.org/2000/svg';let active=0,scale=1,closed=new Set(),nodes=[],edges=[],bounds={w:1,h:1};
const svg=document.getElementById('map'),vp=document.getElementById('viewport');
function el(tag,attrs={},text){let n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
function wrap(s,width){let result=[],line='',w=0;for(const c of s){let cw=c.charCodeAt(0)>255?14:7.6;if(w+cw>width&&line){result.push(line);line='';w=0}line+=c;w+=cw}if(line)result.push(line);return result}
function measure(n,depth){let width=depth===0?226:depth===1?272:depth===2?350:340;let lines=wrap(n.title,width-38);return{...n,depth,w:width,h:Math.max(48,lines.length*22+24),lines,kids:closed.has(n.id)?[]:n.children.map(c=>measure(c,depth+1))}}
function span(n){n.span=n.kids.length?Math.max(n.h,n.kids.reduce((s,c)=>s+span(c),0)+(n.kids.length-1)*14):n.h;return n.span}
function place(n,x,top){n.x=x;n.y=top+n.span/2-n.h/2;nodes.push(n);let cursor=top;for(const c of n.kids){place(c,x+n.w+52,cursor);edges.push([n,c]);cursor+=c.span+14}}
function size(){svg.setAttribute('width',bounds.w*scale);svg.setAttribute('height',bounds.h*scale);svg.setAttribute('viewBox',`0 0 ${bounds.w} ${bounds.h}`);document.getElementById('zoom').textContent=Math.round(scale*100)+'%'}
function render(){nodes=[];edges=[];let root=measure(DATA[active],0);span(root);place(root,24,24);bounds={w:Math.max(...nodes.map(n=>n.x+n.w))+30,h:Math.max(...nodes.map(n=>n.y+n.h))+30};svg.replaceChildren();svg.append(el('title',{},DATA[active].title));
for(const[a,b]of edges){let x=a.x+a.w,y=a.y+a.h/2,u=b.x,v=b.y+b.h/2;svg.append(el('path',{d:`M${x},${y} C${x+26},${y} ${u-26},${v} ${u},${v}`,fill:'none',stroke:b.depth===1?'#7ba9b7':'#c3d4dd','stroke-width':b.depth===1?2:1.4}))}
for(const n of nodes){let fill=n.depth===0?'#173f52':n.depth===1?'#e1f0f2':'#fff',stroke=n.depth===0?'#173f52':n.depth===1?'#80b5bf':'#ccdae3',color=n.depth===0?'#fff':'#253f52';let g=el('g',{'data-id':n.id});if(n.children.length){g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',n.title);g.setAttribute('aria-expanded',String(!closed.has(n.id)));let toggle=()=>{if(closed.has(n.id))closed.delete(n.id);else closed.add(n.id);render()};g.addEventListener('click',toggle);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})}g.append(el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:9,fill,stroke}));let t=el('text',{fill:color,'font-size':14,'font-weight':n.depth<2?'600':'400'});n.lines.forEach((line,i)=>t.append(el('tspan',{x:n.x+15,y:n.y+27+i*22},line)));g.append(t);if(n.children.length){let cx=n.x+n.w,cy=n.y+n.h/2;g.append(el('circle',{cx,cy,r:9,fill:'#fff',stroke}));g.append(el('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':13,fill:'#327185'},closed.has(n.id)?'+':'−'))}svg.append(g)}size();document.getElementById('status').textContent=`${nodes.length} 个可见节点`}
function initial(){closed.clear();function visit(n,d){if(d>=2&&n.children.length)closed.add(n.id);n.children.forEach(c=>visit(c,d+1))}visit(DATA[active],0)}
function select(i){active=i;scale=1;initial();document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));render();vp.scrollTop=0;vp.scrollLeft=0}
DATA.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s.title;b.setAttribute('role','tab');b.addEventListener('click',()=>select(i));document.getElementById('tabs').append(b)});
document.getElementById('collapse').onclick=()=>{initial();render()};document.getElementById('expand').onclick=()=>{closed.clear();render()};document.getElementById('plus').onclick=()=>{scale=Math.min(1.8,scale+.1);size()};document.getElementById('minus').onclick=()=>{scale=Math.max(.2,scale-.1);size()};document.getElementById('reset').onclick=()=>{scale=1;size()};document.getElementById('fit').onclick=()=>{scale=Math.max(.15,Math.min(1,(vp.clientWidth-28)/bounds.w,(vp.clientHeight-28)/bounds.h));size();vp.scrollTop=0;vp.scrollLeft=0};
